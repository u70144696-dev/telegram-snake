<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #17212b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            background-color: #232e3c;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #score {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="score">Счет: 0</div>
    <canvas id="game" width="300" height="300"></canvas>

    <script>
        // Инициализируем Telegram WebApp (чтобы игра развернулась на весь экран)
        let tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 15; // Размер клетки
        const tileCount = canvas.width / gridSize; // Количество клеток

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        
        // Управление (кнопки)
        let changingDirection = false;

        function changeDirection(event) {
            if (changingDirection) return;
            changingDirection = true;

            const keyPressed = event.key;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((keyPressed === 'ArrowLeft' || keyPressed === 'a') && !goingRight) {
                dx = -gridSize; dy = 0;
            }
            if ((keyPressed === 'ArrowUp' || keyPressed === 'w') && !goingDown) {
                dx = 0; dy = -gridSize;
            }
            if ((keyPressed === 'ArrowRight' || keyPressed === 'd') && !goingLeft) {
                dx = gridSize; dy = 0;
            }
            if ((keyPressed === 'ArrowDown' || keyPressed === 's') && !goingUp) {
                dx = 0; dy = gridSize;
            }
        }

        // Управление свайпами для телефона
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            
            let xDiff = touchStartX - touchEndX;
            let yDiff = touchStartY - touchEndY;

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 0 && dx === 0) { dx = -gridSize; dy = 0; } // Влево
                else if (xDiff < 0 && dx === 0) { dx = gridSize; dy = 0; } // Вправо
            } else {
                if (yDiff > 0 && dy === 0) { dx = 0; dy = -gridSize; } // Вверх
                else if (yDiff < 0 && dy === 0) { dx = 0; dy = gridSize; } // Вниз
            }
        });

        function main() {
            if (hasGameEnded()) return;

            changingDirection = false;
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = '#232e3c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = '#4CAF50';
            snake.forEach(part => {
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = `Счет: ${score}`;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            // Проверка, чтобы еда не появилась внутри змейки
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
        }

        function hasGameEnded() {
            // Удар о стену
            if (snake[0].x < 0 || snake[0].x >= canvas.width || snake[0].y < 0 || snake[0].y >= canvas.height) {
                return true;
            }
            // Удар о себя
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        document.addEventListener('keydown', changeDirection);
        generateFood();
        main();
    </script>
</body>
</html>
